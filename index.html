<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3F4042">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Interactive mobile workflow prototype for KTrans. Fictional demonstration data.">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KTrans Ops">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<title>KTrans Ops — MiracleTek mobile workflow prototype</title>
<style>
@font-face{font-family:"Barlow";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-semi-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-semi-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-semi-condensed-latin-700-normal.woff2) format("woff2")}

:root{
  --green:#3C861B; --green-deep:#2B6612; --green-text:#2B6612; --green-wash:#E6F1DF;
  --header:#3F4042; --header-ink:#FFFFFF; --header-mute:#C9CED3;
  --page:#EDF0F3; --card:#FFFFFF; --card2:#F5F7F9; --line:#D8DFE5; --line2:#B4BFC9;
  --ink:#16181B; --muted:#56616C;
  --warn:#7A4A00; --warn-wash:#FFEDC9; --warn-line:#E9C47A;
  --bad:#A4231B; --bad-wash:#FBE3E0; --bad-line:#E6A29C;
  --stripe-b:#FFFFFF; --bezel:#1B1D1F; --backdrop:#DDE2E7; --scrim:rgba(14,16,18,.55);
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-head:"Barlow Semi Condensed","Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --green:#4B9A28; --green-deep:#7CC85A; --green-text:#86D164; --green-wash:#1B2A15;
    --header:#25282B; --header-mute:#9AA5B0;
    --page:#0E1012; --card:#171A1D; --card2:#1E2226; --line:#2B3136; --line2:#434C54;
    --ink:#ECEFF2; --muted:#9AA6B2;
    --warn:#F0B454; --warn-wash:#32250E; --warn-line:#6B4F1B;
    --bad:#FF918A; --bad-wash:#391A18; --bad-line:#7A3732;
    --stripe-b:#2B3136; --bezel:#050606; --backdrop:#08090A; --scrim:rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --green:#4B9A28; --green-deep:#7CC85A; --green-text:#86D164; --green-wash:#1B2A15;
  --header:#25282B; --header-mute:#9AA5B0;
  --page:#0E1012; --card:#171A1D; --card2:#1E2226; --line:#2B3136; --line2:#434C54;
  --ink:#ECEFF2; --muted:#9AA6B2;
  --warn:#F0B454; --warn-wash:#32250E; --warn-line:#6B4F1B;
  --bad:#FF918A; --bad-wash:#391A18; --bad-line:#7A3732;
  --stripe-b:#2B3136; --bezel:#050606; --backdrop:#08090A; --scrim:rgba(0,0,0,.65);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:var(--page)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.ic{flex:none;display:block}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- stage: phone + review panel ---------- */
.stage{height:100%;display:flex;justify-content:center;align-items:stretch;gap:28px}
.phone{position:relative;width:100%;height:100%;overflow:hidden;background:var(--page);display:flex;flex-direction:column}
#screen{flex:1;min-height:0;display:flex;flex-direction:column}
.side{display:none}
@media (min-width:700px){
  html,body{background:var(--backdrop)}
  .stage{padding:20px 24px;align-items:center}
  .phone{width:404px;flex:none;height:min(100%,880px);border-radius:34px;border:9px solid var(--bezel);box-shadow:0 0 0 1px var(--line2)}
}
@media (min-width:1040px){
  .side{display:flex;flex-direction:column;gap:14px;width:380px;height:min(100%,880px);overflow:auto;padding:2px 4px 2px 0}
}
.side .brandbar{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.side .brandbar img{height:26px;width:auto}
.side .brandbar .x{font-family:var(--f-head);font-weight:600;color:#59636d}
.side h2{font-family:var(--f-head);font-size:22px;line-height:1.1;margin:0}
.side .panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.side .panel h3{margin:0 0 4px;font-family:var(--f-head);font-size:17px}
.side .panel p{margin:0 0 8px;color:var(--muted);font-size:14.5px}
.notes{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:10px}
.notes li{display:grid;grid-template-columns:24px 1fr;gap:10px;font-size:15px;align-items:start}
.notes li b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--green);color:var(--green-text);font-size:13px}
.cat{display:grid;gap:10px}
.cat h4{margin:0 0 6px;font-size:13.5px;color:var(--muted);font-weight:600}
.cat .pills{display:flex;flex-wrap:wrap;gap:6px}
.cat button{border:1px solid var(--line2);background:var(--card);border-radius:6px;padding:4px 8px;font-size:13px;font-family:var(--f-head);font-weight:600;letter-spacing:.01em}
.cat button:hover{border-color:var(--green)}
.cat button.on{background:var(--green);border-color:var(--green);color:#fff}
.side .foot{font-size:13px;color:var(--muted)}

/* ---------- shell ---------- */
.shell{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.top{flex:none;background:var(--header);color:var(--header-ink);display:flex;align-items:center;gap:6px;padding:8px 8px 8px 6px;min-height:60px}
.top .ib{flex:none;width:46px;height:46px;display:grid;place-items:center;border:0;background:transparent;color:inherit;border-radius:50%}
.top .ib:active{background:rgba(255,255,255,.14)}
.top .ttl{flex:1;min-width:0;padding-left:2px}
.top .ttl h1{margin:0;font-family:var(--f-head);font-weight:700;font-size:21px;line-height:1.12;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.top .ttl p{margin:1px 0 0;font-size:13px;color:var(--header-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:15px;border:2px solid rgba(255,255,255,.85)}
.code{font-family:var(--f-head);font-weight:600;font-size:12.5px;border:1px solid rgba(255,255,255,.4);border-radius:4px;padding:1px 6px;color:var(--header-mute);margin-right:2px}
.kerb{flex:none;height:6px;background:repeating-linear-gradient(-45deg,var(--green) 0 9px,var(--stripe-b) 9px 18px)}
.conn{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:14px;font-weight:500;background:var(--warn-wash);color:var(--warn);border-bottom:1px solid var(--warn-line)}
.conn.on{background:var(--green-wash);color:var(--green-text);border-bottom-color:var(--line)}
.conn button{margin-left:auto;border:1.5px solid currentColor;background:transparent;border-radius:6px;padding:4px 10px;font-weight:700}
.content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 14px 20px;-webkit-overflow-scrolling:touch;scroll-behavior:auto}
.dock{flex:none;display:flex;gap:10px;padding:10px 14px;background:var(--card);border-top:1px solid var(--line)}
.dock .btn{flex:1;min-width:0;padding:0 10px}
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line)}
.tabs button{position:relative;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 8px;min-height:62px;color:var(--muted);font-size:12.5px;font-weight:600}
.tabs button.on{color:var(--green-text)}
.tabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--green);border-radius:0 0 3px 3px}
.tabs .bd{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
:root[data-theme="dark"] .tabs .bd{color:#1a0b0a}

/* ---------- type & blocks ---------- */
h2.sec{font-family:var(--f-head);font-size:19px;font-weight:700;margin:18px 2px 8px}
h2.sec:first-child{margin-top:4px}
.lead{margin:2px 2px 12px;color:var(--muted);font-size:15.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px}
.card.pad{padding:14px}
.stack{display:grid;gap:10px}
.rows{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{width:100%;display:flex;align-items:center;gap:12px;min-height:60px;padding:11px 14px;background:transparent;border:0;border-bottom:1px solid var(--line);text-align:left}
.row:last-child{border-bottom:0}
.row:active{background:var(--card2)}
.row .tx{flex:1;min-width:0}
.row .t{font-weight:600;font-size:17px;line-height:1.2}
.row .t.id{font-family:var(--f-head);font-size:19px;font-weight:700;letter-spacing:.01em}
.row .s{color:var(--muted);font-size:14.5px;margin-top:2px}
.row .ri{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.row .chev{color:var(--muted)}
.row .lead-ic{width:40px;height:40px;border-radius:8px;background:var(--green-wash);color:var(--green-text);display:grid;place-items:center;flex:none}
.row.bar{border-left:5px solid var(--line2)}
.row.bar.ok{border-left-color:var(--green)}.row.bar.warn{border-left-color:#E0A024}.row.bar.bad{border-left-color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:2px 8px;font-size:13px;font-weight:700;line-height:1.5;border:1px solid var(--line2);background:var(--card2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--green-wash);color:var(--green-text);border-color:transparent}
.chip.warn{background:var(--warn-wash);color:var(--warn);border-color:var(--warn-line)}
.chip.bad{background:var(--bad-wash);color:var(--bad);border-color:var(--bad-line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:6px;border:2px solid var(--green);background:var(--green);color:#fff;font-weight:700;font-size:17px;letter-spacing:.005em;text-align:center}
.btn.full{width:100%}
.btn:active{filter:brightness(.92)}
.btn.sec{background:var(--card);color:var(--ink);border-color:var(--line2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--green-text);min-height:44px}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
:root[data-theme="dark"] .btn.bad{color:#1a0b0a}
.btn.sm{min-height:44px;font-size:15.5px;padding:0 14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid3 .btn{padding:0 6px;font-size:15px;gap:4px}
.two{min-width:0}.two>*{min-width:0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:left}
.tile .k{font-size:13.5px;color:var(--muted);font-weight:500}
.tile .v{font-family:var(--f-head);font-weight:700;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .v.sm{font-size:20px;padding-top:6px}
button.tile{width:100%}
.tile .chip{padding:2px 6px;font-size:12.5px}
button.tile:active{background:var(--card2)}
.banner{display:flex;align-items:center;gap:10px;border-radius:8px;padding:12px 14px;border:1px solid var(--line);background:var(--card);width:100%;text-align:left}
.banner.warn{background:var(--warn-wash);color:var(--warn);border-color:var(--warn-line);font-weight:600}
.banner.bad{background:var(--bad-wash);color:var(--bad);border-color:var(--bad-line);font-weight:600}
.banner.ok{background:var(--green-wash);color:var(--green-text);border-color:transparent;font-weight:600}
.banner .go{margin-left:auto;font-weight:800}
.note{font-size:14px;color:var(--muted);margin:6px 2px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:16px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:600;text-align:right}
.timer{font-family:var(--f-head);font-weight:700;font-size:56px;line-height:1;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer.sm{font-size:30px;text-align:right}
.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--green)}
.bars{display:grid;gap:10px}
.bars .b{display:grid;grid-template-columns:110px 1fr 44px;align-items:center;gap:8px;font-size:14.5px}
.bars .b em{font-style:normal;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.bars .b span.tr{height:12px;border-radius:3px;background:var(--line);overflow:hidden}
.bars .b span.tr i{display:block;height:100%;background:var(--green)}
.bars .b.alt span.tr i{background:var(--line2)}

/* ---------- forms ---------- */
.fld{display:grid;gap:5px;margin:0 0 14px;min-width:0}
.fld .lbl{font-size:14.5px;font-weight:600;color:var(--ink)}
.fld .hint{font-size:13.5px;color:var(--muted)}
.inp{min-width:0;max-width:100%;width:100%;min-height:52px;padding:10px 12px;border-radius:6px;border:1.5px solid var(--line2);background:var(--card);font-size:17px;appearance:none;-webkit-appearance:none}
textarea.inp{min-height:92px;resize:vertical;line-height:1.35}
.inp[readonly]{background:var(--card2);color:var(--muted)}
.inp.err{border-color:var(--bad)}
.selwrap{position:relative}
.selwrap .ic{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}
.selwrap select{padding-right:38px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;font-size:16px}
.chk input{width:26px;height:26px;accent-color:var(--green);flex:none;margin:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{min-height:48px;border-radius:6px;border:1.5px solid var(--line2);background:var(--card);font-weight:700;font-size:15px}
.seg button.on{color:#fff;border-color:transparent;background:var(--steel,#474749)}
.seg button.on.p{background:var(--green)}.seg button.on.f{background:var(--bad)}
:root[data-theme="dark"] .seg button.on.f{color:#1a0b0a}
.item{padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .nm{font-weight:600;font-size:17px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.link{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--green-text);font-weight:700;padding:8px 0;font-size:15.5px;text-align:left}
.photos{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.err-t{color:var(--bad);font-weight:600;font-size:14.5px;margin:6px 0}
.tabstrip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.tabstrip::-webkit-scrollbar{display:none}
.tabstrip button{flex:none;min-height:44px;padding:0 13px;border-radius:22px;border:1.5px solid var(--line2);background:var(--card);font-weight:700;font-size:15.5px}
.tabstrip button.on{background:var(--green);border-color:var(--green);color:#fff}
.search{position:relative;margin-bottom:12px}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .inp{padding-left:42px}

/* ---------- login ---------- */
.login{flex:1;overflow:auto;display:flex;flex-direction:column;padding:26px 24px 18px;background:var(--card)}
.login .logo{height:54px;width:auto;margin:6px auto 4px;display:block}
.login h1{font-family:var(--f-head);font-size:30px;margin:26px 0 2px}
.login .sub{color:var(--muted);margin:0 0 20px}
.login .foot{margin-top:auto;padding-top:24px;display:grid;gap:12px;justify-items:center}
.login .by{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px}
.login .by img{height:26px;width:auto;background:#fff;border-radius:4px;padding:2px 6px}
.offline-chip{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:6px;border:1.5px solid var(--line2);background:var(--green-wash);color:var(--green-text);font-weight:600}
.demo-flag{font-size:12.5px;font-weight:700;color:var(--muted);border:1px solid var(--line2);border-radius:5px;padding:2px 8px}

/* ---------- map / about ---------- */
.path{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.path::-webkit-scrollbar{display:none}
.path span.s{flex:none;background:var(--card);border:1.5px solid var(--green);color:var(--ink);border-radius:6px;padding:6px 10px;font-weight:700;font-size:14px;font-family:var(--f-head);white-space:nowrap}
.path .ar{flex:none;color:var(--muted)}
.mod{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;min-height:96px}
.mod b{font-family:var(--f-head);font-size:18px}
.mod span{font-size:13.5px;color:var(--muted);line-height:1.3}
.mod:active{background:var(--card2)}
.value{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:start}
.value:last-child{border-bottom:0}
.value i{font-style:normal;font-family:var(--f-head);font-weight:700;width:34px;height:34px;border-radius:50%;border:2px solid var(--green);display:grid;place-items:center;color:var(--green-text)}
.value b{display:block;font-size:17px}
.value span{color:var(--muted);font-size:15px}

/* ---------- sheet & toast ---------- */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:30;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:86%;display:flex;flex-direction:column;background:var(--card);border-radius:16px 16px 0 0;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet .hd{display:flex;align-items:center;gap:8px;padding:14px 8px 8px 18px}
.sheet .hd h3{margin:0;flex:1;font-family:var(--f-head);font-size:21px}
.sheet .bd{overflow:auto;padding:4px 18px 8px}
.sheet .ft{display:flex;gap:10px;padding:10px 18px calc(14px + env(safe-area-inset-bottom,0px))}
.sheet .ft .btn{flex:1}
.ib2{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;border-radius:50%;color:var(--muted)}
#toast{position:absolute;left:12px;right:12px;bottom:150px;z-index:40;display:flex;justify-content:center;pointer-events:none}
#toast div{background:#1d2023;color:#fff;border-radius:8px;padding:11px 16px;font-weight:600;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.28);max-width:100%;border-left:5px solid var(--green)}
#toast div.bad{border-left-color:#ff6b61}
#toast div.warn{border-left-color:#E0A024}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>

    dr('pin', { v: '' }); S.draft.pin.v = '';
    sheet('Confirm it is you', `<p class="lead" style="margin-top:0">Approving a purchase order needs your PIN. For this demo, enter any 4 digits.</p>${field('PIN', input('pin', 'v', { type: 'password', mode: 'numeric' }))}`, btn('Confirm and approve', { act: 'pinOk', arg: id }));
    return;
  }
  applyDecision(a, dec, d.c);
};
ACT.pinOk = id => { if (!/^\d{4}$/.test(S.draft.pin.v)) { toast('Enter 4 digits', 'bad'); return; } closeSheet(); const a = S.approvals.find(x => x.id === id); applyDecision(a, 'approve', S.draft['ap_' + id].c); };
function applyDecision(a, dec, comment) {
  a.open = false; a.decision = dec === 'approve' ? 'Approved' : dec === 'return' ? 'Returned for changes' : 'Rejected';
  if (a.kind === 'po') { const p = getPO(a.ref); if (dec === 'approve') { p.status = 'Ordered'; S.k.apprPO++; addNotif('PO approved', `${p.id} can now be issued`, 'PO001'); } else { p.status = dec === 'return' ? 'Returned' : 'Rejected'; S.k.poOpen -= p.net; addNotif(`PO ${dec === 'return' ? 'returned' : 'rejected'}`, `${p.id}: ${comment}`, 'PO001'); } }
  if (a.kind === 'wo') { const w = getWO(a.ref); if (dec === 'approve') { w.status = 'Closed'; S.k.closed++; const as = getAsset(w.asset); if (as && as.status === 'Isolated') { as.status = 'Active'; S.k.ret++; } S.defects.filter(x => x.id === w.defect).forEach(x => x.status = 'Closed'); addNotif('Work order closed', `${w.id} returned to service`, 'W001'); } else { w.status = 'Open'; addNotif('Work order returned', `${w.id}: ${comment}`, 'W002', w.id); } }
  if (a.kind === 'defect') { const df = S.defects.find(x => x.id === a.ref); if (dec === 'approve') { df.status = 'Isolated'; const as = getAsset(df.asset); if (as && as.status !== 'Isolated') { as.status = 'Isolated'; S.k.isol++; } } else df.status = 'Open'; }
  if (a.kind === 'hold') { const p = getPO(a.ref), l = p.lines[0]; if (dec === 'approve') { l.recv = Math.min(l.qty, l.recv + (p.holdQty || 0)); p.status = l.recv >= l.qty ? 'Received' : 'Partial'; S.k.gl += (p.holdQty || 0) * l.price; S.k.recvToday++; } else { p.status = 'Ordered'; addNotif('Receipt rejected', `${p.id} returned to supplier`, 'PO001'); } }
  logAudit(`${a.title}: ${a.decision}`); commit(`${a.title} ${a.decision.toLowerCase()}`); back();
}
